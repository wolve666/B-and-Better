var DB = (function(){

  function save(){ d.rev++; try{ localStorage.setItem(K, JSON.stringify(d)) }catch(e){ toast('Memoria piena: fai un backup') } }
  function id(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6) }
  return {
    houses: function(){ return d.houses },
    house: function(i){ return d.houses.find(function(h){ return h.id === i }) },
    saveHouse: function(h){ if (!h.id){ h.id = id(); d.houses.push(h) } else { var i = d.houses.findIndex(function(x){ return x.id === h.id }); d.houses[i] = h } save(); return h },
    delHouse: function(i){ d.houses = d.houses.filter(function(h){ return h.id !== i }); d.bookings = d.bookings.filter(function(b){ return b.house !== i }); save() },
    moveHouse: function(i, dir){ var a = d.houses, k = a.findIndex(function(h){ return h.id === i }), j = k + dir; if (j < 0 || j >= a.length) return; var t = a[k]; a[k] = a[j]; a[j] = t; save() },

function openSection(k){
  var T = { mov:'Movimenti', mat:'Materiali', spe:'Spese e conteggi', arc:'Archivio' };
  openPage({ title:T[k], build:function(el){
    var t = today(), bk = visBk(), h = '';
    if (k === 'mov'){
      var ev = [];
      bk.forEach(function(b){ if (b.ci >= t && b.ci <= addD(t, 30)) ev.push([b.ci, 'in', b]); if (b.co >= t && b.co <= addD(t, 30)) ev.push([b.co, 'out', b]) });
      ev.sort(function(a, b){ return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : (a[1] === 'out' ? -1 : 1) });
      var stay = bk.filter(function(b){ return b.ci < t && t < b.co }), last = '';
      ev.forEach(function(e){ if (e[0] !== last){ last = e[0]; h += '<div class="sec">' + (e[0] === t ? 'Oggi' : e[0] === addD(t,1) ? 'Domani' : fd(e[0], true)) + '</div>' } h += evRow(e[2], e[1]) });

    } else if (k === 'spe'){
      var c = pd(S.cur), p = c.getFullYear() + '-' + String(c.getMonth()+1).padStart(2,'0'), l = bk.filter(function(b){ return b.ci.slice(0,7) === p });
      var tot = 0, dep = 0, tax = 0, nn = 0; l.forEach(function(b){ tot += b.price||0; dep += b.deposit||0; tax += b.tax||0; nn += nights(b.ci, b.co) });
      h = '<div class="sec" style="text-transform:none;font-size:15px;letter-spacing:0">Arrivi di ' + MESI[c.getMonth()] + ' ' + c.getFullYear() + '</div><div class="grid2">' +

        '<div class="stat"><small>Da incassare</small><b>' + eur(tot - dep) + '</b></div><div class="stat"><small>Tassa di soggiorno</small><b>' + eur(tax) + '</b></div>' +

        '<div class="free" style="margin-top:14px">Il mese è quello mostrato nel calendario. ' + (S.sel ? 'Conteggi solo per la casa selezionata.' : 'Conteggi di tutte le case.') + ' Registro spese in arrivo nelle prossime versioni.</div>';
    } else if (k === 'arc'){
      var past = bk.filter(function(b){ return b.co < t }).sort(function(a, b){ return a.ci > b.ci ? -1 : 1 }), lm = '';
      past.forEach(function(b){ var m = b.ci.slice(0,7); if (m !== lm){ lm = m; var d = pd(b.ci); h += '<div class="sec">' + MESI[d.getMonth()] + ' ' + d.getFullYear() + '</div>' } h += evRow(b, 'out') });

    } else {

// ---------- dati di prova ----------
function demoData(){
  var seed = 7; function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646 } function pick(a){ return a[Math.floor(rnd()*a.length)] }
  var H = [['Casa al Mare','Lungomare Colombo 12'],['La Pineta','Via dei Pini 4'],['Loft Centro','Corso Vittorio 88'],['Il Borgo','Vicolo del Pozzo 3'],['Villa Collina','Strada Panoramica 21'],['Mansarda Blu','Via Garibaldi 45'],['Casa Limoni','Via degli Agrumi 9'],['Il Faro','Piazza del Porto 2'],['Suite Duomo','Via del Duomo 17'],['Rustico','Località Le Vigne']];
  var N = ['Mario Rossi','Anna Bianchi','Luca Verdi','Giulia Romano','Marco Colombo','Sara Ricci','Paolo Marino','Elena Greco','Davide Bruno','Chiara Gallo','Hans Müller','Sophie Martin','John Smith','Laura Conti','Andrea De Luca','Francesca Costa','Pierre Dubois','Emma Wilson','Matteo Fontana','Valentina Rizzo','Klaus Weber','Lucia Moretti','Simone Barbieri','Ana García'];
  var NOTE = ['Arrivo in tarda serata','Chiedono culla per neonato','Hanno un cane di piccola taglia','Anniversario: lasciare una bottiglia di vino','Arrivo con il treno delle 15','Pagamento saldo in contanti','Richiesta colazione senza glutine','Check-out anticipato alle 8','','','',''];
  var houses = H.map(function(h, i){ return { id:'demo' + i, name:h[0], addr:h[1], color:COLORS[i % COLORS.length], tax: [0,1.5,2,2.5,3][i % 5], taxMax: i % 3 ? 7 : 0 } });
  var bookings = [], start = addD(today(), -60), end = addD(today(), 90), k = 0;
  houses.forEach(function(h, i){
    var d = addD(start, Math.floor(rnd()*6));
    while (d < end){
      var n = pick([1,2,2,3,3,3,4,5,7,7,10]), g = pick([1,2,2,2,3,4,4,5]), per = 45 + Math.floor(rnd()*70) + g*10, price = per * n;
      var co = addD(d, n);
      bookings.push({ id:'dbk' + (k++), house:h.id, guest:pick(N), phone:'+39 3' + Math.floor(10 + rnd()*89) + ' ' + Math.floor(1000000 + rnd()*8999999), ci:d, co:co, guests:g, price:price, deposit: rnd() < .7 ? Math.round(price*.3) : 0, notes:pick(NOTE), tax:taxFor(h, g, n), created:Date.now() });
      d = addD(co, Math.floor(rnd()*rnd()*9));
    }
  });
  return { houses:houses, bookings:bookings, settings:DB.set(), rev:0 };
}

// ---------- aggiornamenti ----------
var UPD = { remote:null, native:false, last:0 };
function checkUpdate(manual){
  UPD.last = Date.now();
  if (manual) toast('Controllo aggiornamenti...');
  fetch(RAW + 'version.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ if (!r.ok) throw 0; return r.json() }).then(function(j){
    if (vcmp(j.version, APPV) > 0){
      UPD.remote = j.version; UPD.native = (j.native||1) > NATIVE; render();
      var seen = localStorage.getItem('bb-updseen') === j.version;
      if (manual || (!seen && DB.set().autoupd !== false)) updWindow(j);
    } else { UPD.remote = null; render(); if (manual) toast('Sei già all\'ultima versione') }
  }).catch(function(){ if (manual) toast('Nessuna connessione, riprova più tardi') });
}
function updWindow(j){
  try { localStorage.setItem('bb-updseen', j.version) } catch(e){}
  buzz(30);
  dialog({ title:'Nuova versione ' + j.version, img:true,
    html:'<p>' + (UPD.native ? 'Questa versione richiede la nuova app: scarica e installa l\'APK aggiornata.' : 'Aggiornamento rapido, senza reinstallare l\'app.') + '</p>' + (j.notes ? '<p style="margin-top:8px;font-size:13px">' + esc(j.notes) + '</p>' : ''),
    buttons:[{ t:'Dopo' }, { t: UPD.native ? 'Scarica' : 'Aggiorna', cls:'gold', fn:function(){ if (UPD.native) downloadApp(); else setTimeout(applyUpdate, 60) } }] });
}
function applyUpdate(){
  toast('Scarico l\'aggiornamento...');
  fetch(RAW + 'www/index.html?t=' + Date.now(), { cache:'no-store' }).then(function(r){ if (!r.ok) throw 0; return r.text() }).then(function(h){
    var m = h.match(/var APPV = '([\d.]+)'/); if (!m || h.length < 5000) throw 0;
    localStorage.setItem('bb-html', h); localStorage.setItem('bb-htmlv', m[1]);
    toast('Aggiornata alla ' + m[1]); setTimeout(function(){ location.reload() }, 700);
  }).catch(function(){ toast('Aggiornamento non riuscito, riprova') });
}
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && Date.now() - UPD.last > 10*60*1000) checkUpdate(false) });

  c.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY }, { passive:true });
  c.addEventListener('touchend', function(e){ if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5) shift(dx < 0 ? 1 : -1) }, { passive:true });
})();
// tasto indietro di Android
(function(){ var C = window.Capacitor, A = C && C.Plugins && C.Plugins.App;
  if (A && A.addListener) A.addListener('backButton', function(){ if (STACK.length) back(); else A.exitApp() });
})();
history.replaceState({ bb:0 }, '');
render();

  DLG.lock = 1;
}, 400);
